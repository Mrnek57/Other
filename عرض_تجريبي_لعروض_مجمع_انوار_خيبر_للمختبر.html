<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

html,body{height:100%;margin:0}
body{background:#C85A32;color:#fff;font-family:'Cairo',Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}

.glow{position:absolute;left:50%;top:50%;width:75vmin;height:75vmin;max-width:680px;max-height:680px;transform:translate(-50%,-50%);border-radius:50%;filter:blur(64px);opacity:.3;background:var(--panel,#E0744D);z-index:1;pointer-events:none;transition:background-color .65s}

.c0{bottom:14%;height:66%;transform:translateX(-50%) scale(1.12);z-index:20}
.c1{left:75%;bottom:24%;height:38%;transform:translateX(-50%) scale(.85) rotate(4deg);filter:blur(2px);opacity:.85;z-index:10;cursor:pointer}
.c3{left:25%;bottom:24%;height:38%;transform:translateX(-50%) scale(.85) rotate(-4deg);filter:blur(2px);opacity:.85;z-index:10;cursor:pointer}
.c2{bottom:28%;height:30%;transform:translateX(-50%) scale(.7);filter:blur(4px);opacity:.55;z-index:5;pointer-events:none}
.m .c0{bottom:25%;height:52%;transform:translateX(-50%) scale(1.04)}
.m .c1{left:84%;bottom:35%;height:28%}.m .c3{left:16%;bottom:35%;height:28%}.m .c2{bottom:39%;height:22%}

.c0 .glass{box-shadow:0 30px 60px -12px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.5)}
.m .glass{border-radius:28px;padding:16px}
.shine{position:absolute;top:-80px;right:-80px;width:176px;height:176px;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(24px)}

.top{display:flex;justify-content:space-between;align-items:center;z-index:1}

.mid span{font-weight:700;font-size:18px;opacity:.9;margin-bottom:-8px}
.pct{font-family:'Anton',Impact,sans-serif;font-size:104px;line-height:1;text-shadow:0 10px 25px rgba(0,0,0,.35)}
.m .pct{font-size:60px}.m .mid span{font-size:14px;margin-bottom:-4px}
.blg svg{width:175px;height:132px;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.28))}.m .blg svg{width:110px;height:84px}
.blg{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2;direction:ltr}
.blg .e{font:500 20px Inter,sans-serif}.blg .s{font:400 12px Inter,sans-serif;letter-spacing:.06em;opacity:.9}.blg .a{font-weight:700;font-size:14px}
.pills{z-index:1;border-top:1px solid rgba(255,255,255,.25);padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pills .w{grid-column:span 2}
.pills div{opacity:0;transform:translateY(16px) scale(.7);transition:opacity .25s,transform .25s}
.pills.show div{opacity:1;transform:none;transition:opacity .35s ease-out var(--d,0s),transform .55s cubic-bezier(.34,1.56,.64,1) var(--d,0s)}
.m .pills div{font-size:11px;padding:6px 8px}
.ecg{stroke-dasharray:220;animation:ecg 2.4s cubic-bezier(.4,0,.2,1) infinite;filter:drop-shadow(0 0 4px #5EEAD4)}
@keyframes ecg{0%{stroke-dashoffset:220;opacity:.2}45%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-220;opacity:0}}
.info{position:absolute;z-index:60;left:48px;bottom:48px;max-width:360px;direction:rtl}
.m .info{left:16px;bottom:20px;max-width:230px}
.info .k{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;opacity:.9;margin-bottom:4px;color:#fff}
.info .k svg{color:#6ee7b7}
.info h2{margin:0 0 8px;font-size:24px;font-weight:900;line-height:1.35}.m .info h2{font-size:16px}

.arrows{display:flex;gap:12px;direction:ltr}

.ar:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}.ar:active{transform:scale(.95)}
.m .ar{width:44px;height:44px}
.call{position:absolute;z-index:60;right:48px;bottom:48px;display:flex;flex-direction:column;align-items:flex-end}
.m .call{right:16px;bottom:20px}
.call small{font-size:12px;font-weight:700;opacity:.85;margin-bottom:4px}
.call a{display:flex;gap:12px;align-items:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(12px);padding:14px 24px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.25);font:400 30px/1 'Anton',Impact,sans-serif;letter-spacing:.05em;transition:background .2s,color .2s}
.call a:hover{background:#fff;color:#0f172a}
.m .call a{padding:10px 16px;font-size:20px;gap:8px}
.dots{position:absolute;z-index:60;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:8px}
.m .dots{bottom:172px}
.m #ghost{font-size:113px;top:13%}
.m .glow{width:405px;height:405px}
.dots button{height:8px;width:8px;border:0;padding:0;border-radius:99px;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}
.dots button.on{width:32px;background:#fff}
.jump{animation:jump 1s infinite}
@keyframes pop{0%{transform:scale(.35);opacity:.2}50%{transform:scale(1.4);opacity:1}72%{transform:scale(.92)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .9s ease-out}
@keyframes jump{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}
@media (prefers-reduced-motion:reduce){.ecg,.tag svg,#ghost,.jump{animation:none}}
#start{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(20,20,24,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-family:Cairo,sans-serif;cursor:pointer;text-align:center;padding:24px}
#start .pb{width:92px;height:92px;border-radius:50%;background:#2EC4B6;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(46,196,182,.6);animation:sp 1.6s infinite}
@keyframes sp{to{box-shadow:0 0 0 26px rgba(46,196,182,0)}}
#start b{font-size:22px;font-weight:900}#start small{font-size:14px;opacity:.8}
</style>
</head>
<body>
<div id="stage">
  <div class="grain"></div><div class="glow"></div>
  <div id="ghost" dir="ltr"></div>
  <header>
    <div class="brand"><div class="lbox" id="hlogo"></div>
      <div class="bn"><b>Anwar Kheiber</b><small>مجمع انوار خيبر الطبي</small></div></div>
    <div class="hr">

      <button class="ar" id="next" aria-label="العرض التالي"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>

</div>
<div id="start" dir="rtl" role="button" tabindex="0" aria-label="اضغط للتشغيل"><div class="pb"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></div><b>اضغط للتشغيل</b><small>يمكن تحويله الى فيديو ليتناسب مع الريلز</small></div>
<script>
var OFFERS=[
{p:'70%',badge:'خصم حصري',ghost:'70% OFF',t:'خصم 70% على الفحوصات الأساسية',s:'اطمئن على صحتك بأقوى خصم على أهم التحاليل الدورية الشاملة بدقة عالية.',tests:['الكولسترول','وظائف الكبد','النقرس','الزنك'],bg:'#C85A32',panel:'#E0744D',acc:'#2EC4B6'},
{p:'30%',badge:'خصم مميز',ghost:'30% OFF',t:'خصم 30% على الفيتامينات والغدة',s:'باقة النشاط والحيوية لقياس مستويات الفيتامينات الأساسية ووظائف الغدة الدرقية.',tests:['فيتامين دال','فيتامين ب12','الغدة'],bg:'#2A8C82',panel:'#3FA89D',acc:'#FFD166'},
{p:'25%',badge:'عرض شامل',ghost:'25% OFF',t:'خصم 25% على جميع التحاليل',s:'استفد من خصم فوري ومباشر على كافة الفحوصات المخبرية الأخرى طوال فترة العرض.',tests:['على جميع التحاليل','فحوصات شاملة','نتائج سريعة'],bg:'#3B6E8C',panel:'#5289AA',acc:'#2EC4B6'},
{p:'AK',brand:1,badge:'أنوار خيبر',ghost:'ANWAR LAB',t:'مجمع أنوار خيبر الطبي',s:'أحدث الأجهزة المخبرية وكادر طبي متخصص لخدمتكم. بادر بالحجز والاستفسار الآن.',tests:['0590702226','دقة وموثوقية','رعاية متكاملة'],bg:'#8C3B4A',panel:'#A85262',acc:'#2EC4B6'}
];
var ECG='M73 111 H93 L99 98 L106 125 L115 62 L124 128 L131 94 L137 111 H172';
function logo(pulse){return '<svg viewBox="0 0 260 190" fill="none"><path d="M12 172 H46 V165 H37 L53 115 H78 L75 107 H56 L73 53 L95 165 H84 V172 H126 V165 H117 L88 22 L62 34 L65 40 L70 38 L27 165 H12 V172 Z" fill="currentColor"/><path d="M138 22 H176 V29 H167 V84 L208 29 H196 V22 H236 V29 H223 L184 81 L234 165 H246 V172 H200 V165 H210 L169 96 L167 99 V101 H147 V29 H138 V22 Z" fill="currentColor"/><path d="M147 115 H167 V165 H176 V172 H138 V165 H147 V115 Z" fill="currentColor"/><path d="'+ECG+'" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>'+(pulse?'<path class="ecg" d="'+ECG+'" stroke="#5EEAD4" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>':'')+'</svg>'}
var act='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>';
var $=function(i){return document.getElementById(i)};
var n=OFFERS.length,idx=0,busy=false,auto=true,timer=null,holding=true;
$('hlogo').innerHTML=logo(true);
$('cards').innerHTML=OFFERS.map(function(o){
  var mid=o.brand?'<div class="blg">'+logo(true)+'<span class="e">Anwar Kheiber</span><span class="s">Medical Centre</span><span class="a">مجمع انوار خيبر الطبي</span></div>':'<span>خصم</span><div class="pct" data-v="'+parseInt(o.p,10)+'">'+o.p+'</div>';
  var pills=o.tests.map(function(t,k){return '<div'+(o.tests.length===3&&k===2?' class="w"':'')+' style="--d:'+(.9+k*.35).toFixed(2)+'s">'+t+'</div>'}).join('');
  return '<div class="card"><div class="glass"><div class="shine"></div>'+(o.brand?'':'<div class="wm">'+logo(false)+'</div>')+
  '<div class="top"><span class="badge" style="background:'+o.acc+'">'+o.badge+'</span><div class="ic">'+act+'</div></div><div class="mid">'+mid+'</div><div class="pills">'+pills+'</div></div></div>';
}).join('');
$('dots').innerHTML=OFFERS.map(function(o,i){return '<button aria-label="الانتقال إلى العرض '+(i+1)+'" data-i="'+i+'"></button>'}).join('');
var cards=document.querySelectorAll('.card'),dots=document.querySelectorAll('.dots button');
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function pulseSound(){
  if(!snd||!actx||!bus)return;
  var t=actx.currentTime,tt=t+.44;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+.42);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.4);g.gain.exponentialRampToValueAtTime(.0001,t+.48);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+.5);
  var k=actx.createOscillator(),kg=actx.createGain();
  k.type='sine';k.frequency.setValueAtTime(150,tt);k.frequency.exponentialRampToValueAtTime(42,tt+.3);
  kg.gain.setValueAtTime(.0001,tt);kg.gain.exponentialRampToValueAtTime(.9,tt+.015);kg.gain.exponentialRampToValueAtTime(.0001,tt+.38);
  k.connect(kg);kg.connect(bus);k.start(tt);k.stop(tt+.4);
  var s=actx.createOscillator(),sg=actx.createGain();
  s.type='triangle';s.frequency.setValueAtTime(1760,tt);s.frequency.exponentialRampToValueAtTime(2640,tt+.12);
  sg.gain.setValueAtTime(.0001,tt);sg.gain.exponentialRampToValueAtTime(.12,tt+.01);sg.gain.exponentialRampToValueAtTime(.0001,tt+.25);
  s.connect(sg);sg.connect(bus);s.start(tt);s.stop(tt+.3);
}
function tick(k){
  if(!snd||!actx||!bus)return;
  var t=actx.currentTime+.9+k*.35,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(620+k*110,t);o.frequency.exponentialRampToValueAtTime(1100+k*160,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.28,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.17);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+.2);
}
function countUp(el){
  el.textContent=el.dataset.v+'%';
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  pulseSound();
}
function render(){
  var o=OFFERS[idx],st=$('stage');
  st.style.setProperty('--bg',o.bg);st.style.setProperty('--panel',o.panel);
  cards.forEach(function(c,i){c.className='card c'+((i-idx+n)%n)});
  dots.forEach(function(d,i){d.className=i===idx?'on':''});
  cards.forEach(function(c,i){var pc=c.querySelector('.pct');if(!pc)return;
    if(i===idx&&!calm&&!holding)countUp(pc);else{cancelAnimationFrame(pc._r);pc.classList.remove('pop');pc.textContent=pc.dataset.v+'%'}});
  void document.body.offsetWidth;
  cards.forEach(function(c,i){var pl=c.querySelector('.pills');if(!pl)return;
    if(i===idx){
      if(holding){pl.classList.remove('show');return}
      if(pl.classList.contains('show'))return;
      if(calm){for(var j=0;j<pl.children.length;j++)pl.children[j].style.setProperty('--d','0s');pl.classList.add('show')}
      else{pl.classList.add('show');for(var k=0;k<pl.children.length;k++)tick(k)}
    }else pl.classList.remove('show');
  });
  var g=$('ghost');g.textContent=o.ghost;g.style.animation='none';void g.offsetWidth;g.style.animation='';
  $('ttl').textContent=o.t;$('sub').textContent=o.s;
}
function go(to){
  if(busy)return;busy=true;idx=((to%n)+n)%n;newBus();render();whoosh();
  setTimeout(function(){busy=false},650);schedule();
}
var actx=null,snd=false;
var bus=null;
function newBus(){
  if(!actx)return;
  if(bus){var b=bus,t=actx.currentTime;
    try{b.gain.cancelScheduledValues(t);b.gain.setValueAtTime(b.gain.value,t);b.gain.linearRampToValueAtTime(0,t+.03)}catch(e){}
    setTimeout(function(){try{b.disconnect()}catch(e){}},150)}
  bus=actx.createGain();bus.connect(actx.destination);
}
function whoosh(){
  if(!snd||!actx||!bus)return;
  var t=actx.currentTime,len=.65,buf=actx.createBuffer(1,Math.floor(actx.sampleRate*len),actx.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  var s=actx.createBufferSource();s.buffer=buf;
  var f=actx.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
